<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<meta name="description" content="StackPier 静态交互原型，含基于脱敏部署方案的 FRP 三角色管理。所有业务均为浏览器模拟。">
<title>栈桥 · 交互原型</title><style>body{margin:0;background:#f5f7fa;color:#243447;font:14px/1.7 system-ui,sans-serif}main{max-width:640px;margin:18vh auto;padding:28px}h1{font-size:24px}button{padding:10px 20px;cursor:pointer}p{color:#60748a}</style></head>
<body><main><h1>栈桥 · 交互原型</h1><p id="boot-status" role="status">正在加载本站静态界面资源……</p><noscript>需要启用 JavaScript 才能试用交互原型。</noscript><button id="reload" hidden>重新加载</button></main>
<script>
(async function(){
 try {
  const paths=['assets/workspace.html?base=5e466522','assets/frp.js?review=frp-1'];
  const [base,extension]=await Promise.all(paths.map(async path=>{const response=await fetch(path,{cache:'no-store',credentials:'omit'});if(!response.ok)throw new Error('静态资源 '+response.status);return response.text();}));
  if(!base.startsWith('<!doctype html>')||!extension.includes('const FRP_SOURCE='))throw new Error('静态资源内容不完整');
  const html=base.replace(/<\/body>\s*<\/html>\s*$/i,()=>'<script>'+extension+'\n<\/script></body></html>');
  document.open();document.write(html);document.close();
 }catch(error){document.getElementById('boot-status').textContent='未能载入完整原型。请刷新重试；本站不会发送 SSH 或其他运维请求。'+(error.message||'');const button=document.getElementById('reload');button.hidden=false;button.onclick=()=>location.reload();}
})();
</script></body></html>
