function channelChecks(name,values){return [['http','HTTP 接口'],['telegram','Telegram'],['email','邮件']].map(([v,t])=>`<label class="check"><input type="checkbox" name="${name}" value="${v}" ${values.includes(v)?'checked':''}><span>${t}</span></label>`).join('')}
function dependencies(p){const others=S.projects.filter(x=>x.id!==p.id&&x.life!=='uninstalled');return `<div class="grid2"><section class="card"><div class="card-head"><h2>提示性依赖</h2><span class="tag">不级联操作</span></div><div class="card-body"><form data-form="dependencies" data-id="${p.id}" class="stack"><p class="small muted">这里只标记依赖及已应用变化，不生成数据库连接、不自动部署或启停其他项目。</p><div class="checks">${others.map(x=>`<label class="check"><input name="deps" value="${x.id}" type="checkbox" ${p.deps.includes(x.id)?'checked':''}><span>${h(x.name)} <small class="muted">${h(sname(x.server))}</small></span></label>`).join('')}</div><div class="form-bottom"><span></span><button class="btn primary" type="submit">保存依赖</button></div></form></div></section><div class="stack">${card('待确认的已应用变化',p.depChanges.length?p.depChanges.map(c=>`<div class="probe"><div class="grow"><strong class="small">${h(pname(c.project))}</strong><p class="cell-sub">${h(c.text)}</p><p class="cell-sub">${h(c.change)} · ${fmt(c.time)}</p></div>${btn('确认已处理','confirmdep',{id:p.id,change:c.change},'small')}</div>`).join(''):'<p class="small muted">没有待确认的依赖变化。保存草稿、单纯启停不会产生这个标记。</p>')}${p.software==='mysql'?card('MySQL 主从关系',detail([['项目角色',p.replicaOf?'独立只读副本':'普通 MySQL 项目'],['复制来源',p.replicaOf?h(pname(p.replicaOf)):'尚未配置'],['复制观测',badge(p.replication==='healthy'?'只读复制正常':p.replicaOf?'待核对':'不适用',p.replication==='healthy'?'success':p.replicaOf?'warning':'')]])+`<p class="cell-sub mt">主库条件不足只提示；目标已有业务数据则拒绝初始化。不提供自动切主。</p>`,btn('初始化只读副本','replica',{id:p.id},'small')):''}</div></div>`}
function projectLogs(p){const lines=[`[示例日志] ${p.name} / ${p.type}`,`${fmt(p.observed)}  INFO  recent_runtime=${p.runtime}`,`${fmt(p.observed)}  INFO  applied_content=${p.applied?.version||'none'}`,`${fmt(p.observed)}  INFO  configuration_reference=A${p.appliedRev}`,`${fmt(p.observed)}  INFO  ${p.runtime==='running'?'service is serving requests':p.runtime==='stopped'?'service stopped':'runtime requires verification'}`,...S.operations.filter(o=>o.project===p.id).slice(0,8).map(o=>`${fmt(o.time)}  ${o.status==='failed'?'ERROR':'INFO'}  ${o.label}: ${statusName[o.status]}`)].filter(l=>l.toLowerCase().includes(ui.q.toLowerCase()));return searchFilter('搜索示例日志…',btn('刷新观测','projectcheck',{id:p.id},'','refresh'))+`<pre class="code logbox" style="max-height:none;min-height:320px">${h(lines.join('\n')||'没有匹配行。')}</pre><p class="cell-sub mt">只读示例日志，不是可执行终端；不会拉取真实服务器日志。</p>`}
function templatesPage(){const rows=S.templates.filter(t=>(t.name+' '+(t.software||'')).toLowerCase().includes(ui.q.toLowerCase()));return heading('部署配置','集中保存 Compose 和 systemd 配置文件，已有项目自行选择何时采用。',btn('新增配置','templateedit',{},'primary','plus'),'CONFIGURATION / TEMPLATES')+searchFilter('搜索配置名称或软件…')+`<div class="grid3">${rows.map(t=>`<section class="card project-card"><div class="project-header"><div class="icon-box">${I(t.type==='compose'?'box':'config')}</div><div class="grow"><h3>${h(t.name)}</h3><p class="cell-sub">${t.type==='compose'?'Docker Compose':'systemd'} · 修订 ${t.rev}</p></div></div><p class="small muted" style="min-height:42px">${h(t.contentMode==='file'?'完整配置文件 · 原样保存':t.desc)}</p><div class="project-facts"><div><small>${t.contentMode==='file'?'模板内容':'预设端口'}</small>${t.contentMode==='file'?'完整文件':h(t.port)}</div><div><small>关联项目</small>${S.projects.filter(p=>p.template===t.id).length} 个</div></div><div class="card-actions">${btn('编辑配置','templateedit',{id:t.id},'small','edit')}${btn('用于新项目','newproject',{template:t.id},'small ghost','arrow')}</div></section>`).join('')}</div><div class="mt">${notice('公共配置修改不会自动部署','更新提示只提供采用入口。采用到项目草稿后，仍需明确应用；配置文件正文不会自动替换变量或生成参数。')}</div>`}
function programsPage(){const rows=S.programs.filter(b=>(b.name+' '+b.filename+' '+b.arch).toLowerCase().includes(ui.q.toLowerCase()));return heading('程序文件','维护现成二进制及其架构；不拉取源码、不编译、不自动部署。',btn('上传程序','programupload',{},'primary','upload'),'CONFIGURATION / BIN')+searchFilter('搜索程序名称或架构…')+`<section class="card"><div class="table-wrap"><table><thead><tr><th>程序</th><th>系统架构</th><th>文件名 / 内容身份</th><th>大小</th><th>最近替换</th><th class="right">操作</th></tr></thead><tbody>${rows.map(b=>`<tr><td><div class="flex"><span class="icon-box">${I('file')}</span><strong class="cell-title">${h(b.name)}</strong></div></td><td><span class="tag">${h(b.arch)}</span></td><td><span class="mono">${h(b.filename)}</span><p class="cell-sub mono">${h(b.identity)}</p></td><td>${h(b.size)}</td><td>${fmt(b.time)}</td><td class="right">${btn('替换文件','programupload',{id:b.id},'small')}</td></tr>`).join('')}</tbody></table></div>${!rows.length?empty('尚无程序文件','上传仅模拟文件选择，不会向服务器传输文件。'):''}</section><div class="grid2 mt">${card('部署时按目标架构匹配',`<p class="small muted">相同程序可以提供多种架构文件。这里的 x86_64 与 aarch64 只是演示样例，不限制正式产品的 ARM / x86 范围。缺少适配文件时，部署应明确提示。</p>`)}${card('上传不是部署',`<p class="small muted">替换当前文件只产生可采用更新；现有项目继续使用已部署内容。不会自动保留历史二进制作为回退库。</p>`)}</div>`}
function backupTable(rows){return `<section class="card"><div class="table-wrap"><table><thead><tr><th>项目 / 备份时间</th><th>范围</th><th>产物结果</th><th>大小 / 分层</th><th>保护</th><th class="right">操作</th></tr></thead><tbody>${rows.slice().sort((a,b)=>new Date(b.time)-new Date(a.time)).map(b=>`<tr><td><button class="link cell-title" data-action="project" data-id="${h(b.project)}">${h(pname(b.project))}</button><p class="cell-sub">${fmt(b.time)}</p></td><td>配置、程序、文件${b.databases?.length?`<p class="cell-sub">数据库：${h(b.databases.join('、'))}</p>`:pr(b.project)?.software==='redis'?'<p class="cell-sub">Redis 整体数据</p>':'<p class="cell-sub">不猜测共享数据库范围</p>'}</td><td>${status(b.status)}</td><td>${h(b.size)}<p class="cell-sub">${h(b.kind)}层 · ${h(b.source)}</p></td><td>${b.protected?badge('保护副本','success'):badge(b.status==='unknown'?'不计入保护底线':'按策略保留')}</td><td class="right">${btn('详情','backupdetail',{id:b.id},'small ghost')}${b.status==='usable'?btn('恢复','restore',{id:b.id},'small'):btn('核对产物','verifybackup',{id:b.id},'small')}</td></tr>`).join('')}</tbody></table></div>${rows.length?'':empty('没有备份产物','项目卸载不会删除历史备份。可以发起一次演示备份。')}${rows.length?'<div class="table-total"><span>产物可用性与整次操作结果分别记录</span><span>无额外覆盖前现场副本</span></div>':''}</section>`}
function backupsPage(){return heading('备份与恢复','明确范围、保护已有副本，并保留恢复与启动的分项结果。',btn('发起备份','choosebackup',{},'primary','backup'),'PROTECTION / BACKUPS')+tabs([['archives','备份产物'],['ranges','备份范围']],ui.backupTab,'backuptab')+(ui.backupTab==='archives'?searchFilter('搜索项目或备份结果…')+backupTable(S.backups.filter(b=>(pname(b.project)+' '+b.status+' '+b.source).toLowerCase().includes(ui.q.toLowerCase()))):`<section class="card"><div class="table-wrap"><table><thead><tr><th>项目</th><th>文件 / 数据范围</th><th>停服要求</th><th>保存目的地</th><th class="right">操作</th></tr></thead><tbody>${S.projects.map(p=>`<tr><td><strong class="cell-title">${h(p.name)}</strong></td><td><code>${h(p.backup.path||p.cfg.dataDir)}</code><p class="cell-sub">${p.software==='redis'?'Redis 实例整体数据':p.backup.mysql?'MySQL '+h(pname(p.backup.mysql))+' / '+h(p.backup.databases.join('、')):p.software==='mysql'?'该实例数据库范围（演示）':'未额外指定数据库'}</p></td><td>${badge(p.backup.stop?'允许临时停服':'不允许停服',p.backup.stop?'warning':'')}<p class="cell-sub">${p.backup.stop?'上限 '+p.backup.maxMinutes+' 分钟（示例）':'一致性方案待专项验证'}</p></td><td>${p.backup.destination==='controller'?'栈桥所在机器':'其他目的地（待选适配）'}</td><td class="right">${btn('配置范围','backupconfig',{id:p.id},'small')}</td></tr>`).join('')}</tbody></table></div></section>`)}
function plansPage(){return heading('计划与策略','集中维护可复用定义；不会在当前原型中创建任何真实定时任务。',ui.planTab==='plans'?btn('新增计划','planedit',{},'primary','plus'):btn('新增保护策略','policyedit',{},'primary','plus'),'PROTECTION / PLANS')+tabs([['plans','执行计划'],['policies','保护策略']],ui.planTab,'plantab')+(ui.planTab==='plans'?`<div class="stack">${S.plans.map(pl=>`<section class="card"><div class="card-head"><div class="flex"><div class="icon-box">${I('clock')}</div><div><h3>${h(pl.name)}</h3><p class="cell-sub">${h(pl.schedule)} · ${h(pl.timezone)} · ${pl.kind==='backup'?'备份计划':'清理计划'}</p></div></div><div class="flex">${badge(pl.enabled?'计划已启用':'计划已暂停',pl.enabled?'success':'')}${btn('编辑','planedit',{id:pl.id},'small')}${btn(pl.enabled?'暂停计划':'启用计划','toggleplan',{id:pl.id},'small ghost')}</div></div><div class="card-body"><div class="flex between wrap mb"><span class="small muted">共享策略：${h(S.policies.find(x=>x.id===pl.policy)?.name||'待指定')} ${pl.preclean?' · 先保护性清理，再备份':''}</span>${btn('模拟本次到期','triggerplan',{id:pl.id},'small','play')}</div><div class="chip-list">${pl.projects.map(id=>{const p=pr(id);return `<div class="check-card flex"><button class="link small" data-action="project" data-id="${h(id)}">${h(pname(id))}</button>${p?.plansPaused?badge('此项目已暂停'):badge(pl.enabled?'等待计划时间':'暂停','')}${p?.plansPaused&&p.life==='installed'?btn('手动恢复','resumeprojectplan',{id},'small ghost'):''}</div>`}).join('')}</div></div><div class="card-foot">同一计划上次未结束：跳过；控制器停机错过：不补跑；跳过时不单独执行前置清理。</div></section>`).join('')||`<section class="card">${empty('还没有计划','备份没有统一默认周期，请自行明确时间与范围。')}</section>`}</div>`:`<div class="grid2">${S.policies.map(po=>card(po.name,`<div class="grid4"><div><span class="small muted">日保留</span><h2>${po.days}</h2></div><div><span class="small muted">周保留</span><h2>${po.weeks}</h2></div><div><span class="small muted">月保留</span><h2>${po.months}</h2></div><div><span class="small muted">最低可用份数</span><h2>${po.min}</h2></div></div><p class="cell-sub mt">空间阈值 ${po.free} GB · ${h(po.note)}</p><p class="cell-sub">新备份尚未核对前不计入保护底线；前置清理不得假定新备份必成功。</p>`,btn('编辑','policyedit',{id:po.id},'small'))).join('')}</div><div class="mt">${notice('这些数值是虚构样例，不是已确认默认值','正式的分层数量、最低份数和空间阈值仍待配置与专项审阅。原型中可调整以验证交互。')}</div>`)}
function monitorPage(){return heading('巡检与通知','只检查、只通知；不因为发现异常自动重启、修复或覆盖文件。',btn('检查适用项目','checkall',{},'primary','refresh'),'OPERATIONS / MONITORING')+tabs([['checks','检查结果'],['notifications','通知记录']],ui.monitorTab,'monitortab')+(ui.monitorTab==='checks'?`<section class="card"><div class="table-wrap"><table><thead><tr><th>项目</th><th>SSH</th><th>运行 / 健康</th><th>配置与资源</th><th>最近检查 / 周期</th><th class="right">操作</th></tr></thead><tbody>${S.projects.map(p=>`<tr><td><button class="link cell-title" data-action="project" data-id="${p.id}">${h(p.name)}</button>${p.replicaOf?'<p class="cell-sub">MySQL 只读副本</p>':''}</td><td>${badge(sr(p.server)?.state==='online'?'可达':'待核对',sr(p.server)?.state==='online'?'success':'warning')}</td><td>${runtimeBadge(p)}<p class="cell-sub">${p.desired==='stopped'&&p.runtime==='stopped'?'预期停止，不报相应不可用':p.health==='healthy'?'端点最近通过':p.health==='na'?'端点不适用':'端点需要核对'}</p></td><td>${badge(p.components.length?'变更未完成':p.applied?'参照一致':'未部署',p.components.length?'warning':'')}<p class="cell-sub">资源按原规则独立检查</p></td><td>${fmt(p.lastCheck)}<p class="cell-sub">${p.plansPaused?'卸载后已暂停':p.monitor.hours+' 小时 / 次（示例）'}</p></td><td class="right">${btn('设置','projectmonitorsettings',{id:p.id},'small ghost')}${btn('检查','projectcheck',{id:p.id},'small')}</td></tr>`).join('')}</tbody></table></div></section><div class="mt">${notice('六类检查按项目适用性启用','SSH、服务运行、HTTP/TCP、配置/二进制偏差、服务器资源、服务专属状态；观测位置与标准由后续专项设计确定。')}</div>`:`<section class="card"><div class="card-head"><h2>演示通知记录</h2>${btn('通知设置','navigate',{page:'settings'},'small')}</div><div class="table-wrap"><table><thead><tr><th>时间</th><th>项目</th><th>通知内容</th><th>渠道</th><th>模拟交付</th></tr></thead><tbody>${S.notifications.map(n=>`<tr><td>${fmt(n.time)}</td><td>${h(n.project?pname(n.project):'全局')}</td><td>${h(n.text)}</td><td>${h(n.channel)}</td><td>${status(n.status)}</td></tr>`).join('')}</tbody></table></div><div class="card-foot">持续异常：每次检查仍通知；恢复正常：不发送额外恢复通知。这里没有真实发送。</div></section>`)}
function firewallPage(){let rules=S.firewalls.filter(r=>(ui.server==='all'||r.server===ui.server)&&(r.port+' '+r.address+' '+sname(r.server)).toLowerCase().includes(ui.q.toLowerCase()));return heading('主机防火墙','保留既有规则；明确确认后才提交单次修改，不随项目部署自动变更。',btn('新增规则','firewalledit',{},'primary','plus'),'NETWORK / FIREWALL')+searchFilter('搜索地址、端口或服务器…',`<select class="filter" data-filter="server" aria-label="防火墙服务器"><option value="all">全部服务器</option>${S.servers.map(s=>`<option value="${s.id}" ${ui.server===s.id?'selected':''}>${h(s.name)}</option>`).join('')}</select>`)+`<section class="card"><div class="table-wrap"><table><thead><tr><th>服务器 / 来源</th><th>方向 / 作用对象</th><th>协议与端口</th><th>来源或目标地址</th><th>动作 / 用途</th><th class="right">操作</th></tr></thead><tbody>${rules.map(r=>`<tr><td>${h(sname(r.server))}<p class="cell-sub">${h(r.origin)}</p></td><td>${r.direction==='in'?'入站访问':'出站访问'}<p class="cell-sub">${r.scope==='container'?'容器发布端口':'主机服务'}</p></td><td><span class="mono">${h(r.protocol)} / ${h(r.port)}</span></td><td><code>${h(r.address)}</code><p class="cell-sub">${r.direction==='in'?'访问来源':'连接目标'}</p></td><td>${badge(r.action==='allow'?'允许':'拒绝',r.action==='allow'?'success':'warning')}<p class="cell-sub">${r.protected?'管理通路保护':r.projects.length?r.projects.map(pname).map(h).join('、'):'未登记项目用途'}</p></td><td class="right">${btn('编辑','firewalledit',{id:r.id},'small ghost')}${btn('删除','firewalldelete',{id:r.id},'small ghost','trash')}</td></tr>`).join('')}</tbody></table></div>${!rules.length?empty('暂无匹配规则','本原型不会清空或重置现有规则。'):''}</section><div class="mt">${notice('主机防火墙，不是云安全组','只演示入站 / 出站和容器发布端口访问控制。不提供整体清空、替换防火墙工具或通用默认策略编辑。')}</div>`}
function dnsPage(){const rows=S.dns.filter(r=>(ui.zone==='all'||ui.zone===r.zone)&&(r.name+'.'+r.zone+' '+r.content).toLowerCase().includes(ui.q.toLowerCase()));return heading('DNS 记录','Cloudflare 单账号、多域名集中管理。关联项目仅说明用途，不是独占证明。',btn('新增记录','dnsedit',{},'primary','plus'),'NETWORK / DNS')+searchFilter('搜索域名、记录或解析内容…',`<select class="filter" data-filter="zone" aria-label="域名筛选"><option value="all">全部域名</option>${['example.com','example.net'].map(z=>`<option ${ui.zone===z?'selected':''}>${z}</option>`).join('')}</select><span class="tag">${h(S.settings.cfName)}</span>`)+`<section class="card"><div class="table-wrap"><table><thead><tr><th>类型</th><th>记录名称</th><th>内容</th><th>代理 / TTL</th><th>关联用途</th><th class="right">操作</th></tr></thead><tbody>${rows.map(r=>`<tr><td><span class="tag mono">${h(r.type)}</span></td><td><strong class="cell-title">${h(r.name==='@'?r.zone:r.name+'.'+r.zone)}</strong><p class="cell-sub">${h(r.zone)}</p></td><td><code>${h(r.content)}</code></td><td>${badge(r.proxy?'已代理':'仅 DNS',r.proxy?'warning':'')}<p class="cell-sub">TTL ${h(r.ttl)}</p></td><td>${r.projects.length?r.projects.map(id=>`<button class="link small" data-action="project" data-id="${h(id)}">${h(pname(id))}</button>`).join('<br>'):'<span class="muted">未关联</span>'}${r.projects.length>1?'<p class="cell-sub">共享用途</p>':''}</td><td class="right">${btn('编辑','dnsedit',{id:r.id},'small ghost')}${btn('删除','dnsdelete',{id:r.id},'small ghost','trash')}</td></tr>`).join('')}</tbody></table></div>${!rows.length?empty('没有匹配的 DNS 记录','可选择域名并新增一条虚构记录。'):''}</section><div class="mt">${notice('确认修改后立即开始本次提交','不是输入字段时即时修改，也不需要先保存草稿再应用；提供商确认结果与公网传播时间不是同一件事。')}</div>`}
function operationTable(rows){return `<section class="card"><div class="table-wrap"><table><thead><tr><th>操作</th><th>触发时间</th><th>执行结果</th><th>已知事实</th><th class="right">详情</th></tr></thead><tbody>${rows.map(o=>`<tr><td><button class="link cell-title" data-action="opdetail" data-id="${h(o.id)}">${h(o.label)}</button><p class="cell-sub mono">${h(o.id)}</p></td><td>${fmt(o.time)}</td><td>${status(o.status)}${o.status==='running'?`<div class="progress"><i style="width:${Math.round(o.steps.filter(s=>s.status==='success').length/o.steps.length*100)}%"></i></div>`:''}</td><td style="max-width:330px"><span class="small muted">${h(o.message||'已固定本次输入，分项执行中。')}</span></td><td class="right">${btn(o.status==='unknown'?'核对原操作':'查看','opdetail',{id:o.id},'small','arrow')}</td></tr>`).join('')}</tbody></table></div>${!rows.length?empty('还没有记录','拒绝与跳过也会留有原因，但不会排队。'):''}</section>`}
function operationsPage(){const rows=S.operations.filter(o=>(o.label+' '+o.id+' '+o.message).toLowerCase().includes(ui.q.toLowerCase())&&(ui.filter==='all'||o.status===ui.filter));return heading('操作记录','查看一次操作完成了哪些部分，哪些失败，哪些结果尚不明确。','','OPERATIONS / HISTORY')+searchFilter('搜索操作、项目或记录编号…',`<select class="filter" data-filter="filter" aria-label="操作结果">${[['all','全部结果'],['running','执行中'],['success','成功'],['failed','明确失败'],['partial','部分完成'],['unknown','待核对'],['rejected','已拒绝'],['skipped','已跳过'],['missed','已错过']].map(([v,t])=>`<option value="${v}" ${ui.filter===v?'selected':''}>${t}</option>`).join('')}</select>`)+operationTable(rows)}
function settingsPage(){return heading('设置','仅保存演示配置，不发送通知、不访问 Cloudflare，也不创建真实计划。','','INSTANCE / SETTINGS')+`<div class="grid2"><section class="card"><div class="card-head"><h2>默认通知渠道</h2><span class="tag">项目可覆盖</span></div><div class="card-body"><form class="stack" data-form="settings"><div class="flex wrap">${channelChecks('channels',S.settings.channels)}</div>${field('setting-http','自定义 HTTP 通知地址',S.settings.http,'原型不会请求此地址；请仅使用示例值。','url')}${field('setting-tg','Telegram 目标（演示）',S.settings.telegram)}${field('setting-email','通知邮箱（演示）',S.settings.email,'','email')}${select('setting-zone','计划显示时区',[['Asia/Tokyo','Asia/Tokyo'],['Asia/Shanghai','Asia/Shanghai'],['UTC','UTC']],S.settings.timezone,'示例时区，不代替实际计划确认。')}<div class="form-bottom">${btn('模拟测试通知','testnotice',{},'') }<button class="btn primary" type="submit">保存演示设置</button></div></form></div></section><div class="stack">${card('通知行为',detail([['持续异常','每次检查仍发送'],['恢复正常','不额外发送恢复通知'],['自动修复','不启用，不提供'],['通知渠道','HTTP / Telegram / 邮件']]))}${card('Cloudflare 账号',`<p class="small">${h(S.settings.cfName)}</p><p class="cell-sub mt">仅单账号、多域名。原型没有 API Token 或真实连接，也不涉及证书、域名购买及其他 CDN 功能。</p>`,btn('修改演示名称','cfaccount',{},'small'))}${notice('这里不是栈桥自身备份入口','控制器资料备份由用户自行处理。本原型没有新增控制器导出、恢复或自备份计划。')}</div></div>`}
function authPage(){const setup=ui.auth==='setup',success=ui.auth==='setup-success',blocked=ui.auth==='blocked';return `<div class="auth-shell"><header class="auth-header">${brand()}<span class="small muted">${setup?'首次使用':'实例访问'} · 仅演示</span></header><main class="auth-main"><section class="auth-card">${blocked?`<h1>远程初始化受限</h1><p class="small muted">这是现有访问边界的演示状态，请从允许的初始化来源完成首次设置。</p><div class="mt">${btn('切换到允许的演示来源','authsetup',{},'primary')}</div>`:success?`<h1>设置完成</h1><p class="small muted">演示访问密码已在本页内存中设置。下一步登录工作台。</p><div class="mt">${btn('前往登录','authlogin',{},'primary')}</div>`:`<h1>${setup?'设置你的栈桥':'欢迎回到栈桥'}</h1><p class="small muted">${setup?'设置演示访问密码，开始使用个人管理空间。':'输入演示访问密码，进入工作台。'}</p><form data-form="auth" class="stack">${field('access-password',setup?'设置访问密码':'访问密码','','请勿输入真实密码；这里只模拟界面，不提供实际访问保护。','password','required')}${setup?field('access-confirm','再次输入密码','','','password','required'):''}<p id="auth-error" class="field-error" role="alert" hidden></p><button type="submit" class="btn primary">${setup?'完成设置':'登录'}</button>${btn('填入演示密码','fillpassword',{},'ghost')}</form>`}<p class="cell-sub mt">演示密码：<code>${DEMO_PASSWORD}</code></p></section><div class="flex between mt">${btn('直接进入演示工作台','demologin',{},'ghost')}${btn(setup?'已有实例，去登录':'体验首次初始化',setup?'authlogin':'authsetup',{},'ghost')}</div></main></div>`}
// 所有表单与浮层都在本地交互；原生 dialog 提供焦点圈定和 Escape 关闭。
const dialog=document.getElementById('modal');let lastFocus=null;
function openModal(kind,data={}){if(!dialog.open)lastFocus=document.activeElement;ui.modal={kind,...data};renderModal();if(!dialog.open)dialog.showModal();setTimeout(()=>{(dialog.querySelector('[autofocus]')||dialog.querySelector('input:not([type=checkbox]):not([disabled]),select,textarea,button'))?.focus()},0)}
function closeModal(){if(dialog.open)dialog.close();ui.modal=null;try{lastFocus?.focus({preventScroll:true})}catch{}}
function layout(title,subtitle,body,foot='',wide=false,form=''){dialog.classList.toggle('wide',wide);dialog.innerHTML=`${form?`<form data-form="${h(form)}" class="dialog-layout">`:'<div class="dialog-layout">'}<div class="dialog-header"><div><h2 id="dialog-title">${h(title)}</h2><p>${h(subtitle)}</p></div><button type="button" class="modal-close" data-action="closemodal" aria-label="关闭">${I('close')}</button></div><div class="dialog-body">${body}<p class="field-error" id="modal-error" role="alert" hidden></p></div><div class="dialog-footer">${foot||btn('关闭','closemodal')}</div>${form?'</form>':'</div>'}`;}
function modalError(text){const el=document.getElementById('modal-error');if(el){el.hidden=false;el.textContent=text;el.scrollIntoView({block:'nearest'});}else toast(text,'error');return false;}
function outcomeField(value='success',options=null){return `<div class="form-section">${select('outcome','本次演示结果（原型工具，不是产品设置）',options||[['success','正常完成'],['failed','明确失败（原操作已结束）'],['partial','部分完成'],['unknown','SSH / 响应丢失，结果待核对']],value,'仅注入模拟结果，不连接真实环境。')}</div>`}
function projectChecks(name,selected=[],candidates=S.projects){return `<div class="checkbox-grid">${candidates.map(p=>`<label class="check"><input type="checkbox" name="${name}" value="${p.id}" ${selected.includes(p.id)?'checked':''}><span>${h(p.name)}${p.life==='uninstalled'?'<small class="muted">（已卸载）</small>':''}</span></label>`).join('')}</div>`}

function resourcesFor(p,kind){const keys=['project:'+p.id];if(p.software==='mysql')keys.push('mysql:'+p.id+':*');if(p.software==='redis')keys.push('redis:'+p.id+':*');if(['backup','restore'].includes(kind)&&p.backup.mysql)p.backup.databases.forEach(db=>keys.push('mysql:'+p.backup.mysql+':'+db));return keys;}
function intersects(a,b){return a===b||(a.endsWith(':*')&&b.startsWith(a.slice(0,-1)))||(b.endsWith(':*')&&a.startsWith(b.slice(0,-1)));}
function conflictFor(resources){return S.operations.find(o=>['running','unknown'].includes(o.status)&&!o.protectionReleased&&o.resources?.some(a=>resources.some(b=>intersects(a,b))));}
function record(label,kind,project,statusValue,message,extra={}){const o={id:uid('op'),label,kind,project,status:statusValue,time:now(),ended:now(),message,steps:[],input:{},resources:[],...extra};S.operations.unshift(o);persist();return o;}
function rejectOperation(p,kind,message,extra={}){const o=record((opLabels[kind]||kind)+' '+(p?.name||''),kind,p?.id,'rejected',message,extra);closeModal();render();openModal('opdetail',{id:o.id});return null;}
function stepsFor(kind,input){const titles={deploy:['核对环境、身份与本次输入','交付程序 / 镜像与配置','建立核心运行定义','按目标启停并核对'],apply:['固定草稿与检查冲突','逐项交付配置内容','必要激活 / 保持停止','核对结果与完整参照'],update:['固定程序 / 镜像内容','交付程序及相关配置','必要激活 / 保持停止','核对实际更新结果'],start:['检查运行前提','提交启动','核对运行与端点'],stop:['检查目标与影响范围','提交停止','核对实际停止'],restart:['核对原运行目标','停止运行实体','重新启动','核对运行结果'],backup:['核对显式范围和副本保护','前置清理及可用空间检查','备份配置、程序、文件与指定数据','核对备份产物',input.stop?'恢复原运行状态 / 安全收尾':'完成记录（不改变服务运行）'],restore:['核对来源、范围及恢复前状态','覆盖项目文件','覆盖选定数据库并核对','按既定成功条件启动'],uninstall:['核对核心资源和清理选项','停止并移除核心运行实体','处理明确选定的业务数据','删除明确选定的网络条目'],replica:['核对主库条件与目标空库','准备并导入初始数据','写入复制配置并保持只读','核对复制运行'],env:['核对已授权管理身份','安装缺失依赖','检查已存在及新安装环境'],network:['核对目标、权限与影响','提交本次网络修改','读取核对目标条目']};return (titles[kind]||titles.network).map(title=>({title,status:'pending',note:''}));}
function startOperation(p,kind,input={},outcome='success',options={}){
 if(p){
  if(['apply','update','start','stop','restart','backup','uninstall','replica'].includes(kind)&&p.life!=='installed')return rejectOperation(p,kind,'当前项目不是完整已部署状态，不能直接执行此操作。请先处理现有部署事实。');
  if(p.unsafe&&['start','restart','backup'].includes(kind))return rejectOperation(p,kind,'已有部分覆盖尚未处理，不能用普通启动掩盖不安全的数据状态。');
  if(kind==='restart'&&p.desired==='stopped')return rejectOperation(p,kind,'项目是主动停止目标。需要运行请明确提交启动，不通过重启隐式改变目标。');
  if(kind==='restore'&&p.life!=='uninstalled'&&p.runtime==='unknown')return rejectOperation(p,kind,'恢复前实际运行状态未知，先核对原项目状态，不以期望运行冒充恢复前正在运行。');
  const resources=[...resourcesFor(p,kind),...(input.extraResources||[])];const conflict=conflictFor(resources);

 case'cleanup':{const policy=S.policies.find(p=>p.id===m.policy)||S.policies[0],selected=m.candidates.filter(id=>has('clean-'+id));if(!selected.length){modalError('请选择至少一个候选产物；受保护副本不能选择。');break;}if(S.operations.some(o=>['running','unknown'].includes(o.status)&&!o.protectionReleased&&o.kind==='restore'&&selected.includes(o.input.backupId))){modalError('候选中包含当前覆盖恢复正在使用的源备份，不能清理。');break;}const counts={};S.backups.filter(b=>b.status==='usable').forEach(b=>counts[b.project]=(counts[b.project]||0)+1);for(const id of selected){const b=S.backups.find(x=>x.id===id);if(b.protected||--counts[b.project]<policy.min)throw new Error('不能低于该项目最低可用备份份数。');}const fail=get('outcome')==='failed';if(!fail)S.backups=S.backups.filter(b=>!selected.includes(b.id));const o=record('保护性清理（演示）','cleanup',null,fail?'failed':'success',fail?'清理失败，未移除演示产物。':'只处理已确认候选，保护底线仍保留。',{steps:[{title:'核对候选和保护底线',status:'success'},{title:'处理选中产物',status:fail?'failed':'success'}]});persist();closeModal();render();openModal('opdetail',{id:o.id});break;}
 case'dnsedit':{if(!has('network-ack')){modalError('请核对并明确确认本次网络变更影响。');break;}const type=get('dns-type'),content=get('dns-content');if(type==='A'&&!validIPv4(content)){modalError('A 记录内容应为有效 IPv4 地址。');break;}if(type==='AAAA'&&!validIPv6(content)){modalError('AAAA 记录内容应为有效 IPv6 地址。');break;}const ttl=get('dns-ttl');if(ttl!=='自动'&&(!/^\d+$/.test(ttl)||Number(ttl)<60||Number(ttl)>86400)){modalError('演示 TTL 请使用“自动”或 60–86400 秒。');break;}if(type==='TXT'&&has('dns-proxy')){modalError('TXT 不支持此代理选项。');break;}const r={id:m.id||uid('dns'),zone:get('dns-zone'),type,name:get('dns-name'),content,ttl,proxy:has('dns-proxy'),projects:all('dns-project')};networkOperation('dns','upsert',r,get('outcome'));break;}
 case'firewalledit':{const old=S.firewalls.find(r=>r.id===m.id);if(old?.protected){modalError('受保护的 SSH 管理通路不允许在此原型直接修改。');break;}if(!has('network-ack')){modalError('请核对影响范围及 SSH 管理通路。');break;}const ports=get('fw-port').split('-').map(Number);if(ports.length>2||ports.some(n=>!Number.isInteger(n)||n<1||n>65535)||(ports.length===2&&ports[0]>ports[1])){modalError('端口应在 1–65535，或使用有序端口范围。');break;}if(!validAddress(get('fw-address'))){modalError('请输入有效的 IP 或 CIDR 地址范围。');break;}const r={id:old?.id||uid('fw'),server:get('fw-server'),direction:get('fw-direction'),protocol:get('fw-protocol'),port:get('fw-port'),address:get('fw-address'),action:get('fw-action'),scope:get('fw-scope'),projects:all('fw-project'),origin:old?.origin||'栈桥登记',protected:false};if(r.action==='deny'&&ports[0]<=sr(r.server).port&&(ports[1]||ports[0])>=sr(r.server).port&&r.direction==='in'){modalError('该拒绝规则可能破坏 SSH 管理通路，原型暂不放行。');break;}networkOperation('firewall','upsert',r,get('outcome'));break;}
 case'networkdelete':{const type=m.kind==='dnsdelete'?'dns':'firewall',r=(type==='dns'?S.dns:S.firewalls).find(r=>r.id===m.id);if(r.protected||!has('delete-ack')||(r.projects.length>1&&!has('shared-ack'))){modalError(r.protected?'不能删除受保护管理通路。':'请明确确认删除；共享条目需额外确认影响。');break;}networkOperation(type,'delete',r,get('outcome'));break;}
 case'verifyop':{const o=S.operations.find(o=>o.id===m.id),v=get('verify-result');if(v==='working'){o.message='演示核对发现原执行尚未结束，结果继续待核对；保护保持。';persist();openModal('opdetail',{id:o.id});break;}if(!has('verify-evidence')){modalError('请先核对原操作身份、停止写入与当前资源证据。');break;}if(v==='ended-unknown'){o.protectionReleased=true;o.ended=now();o.message='已证实原执行不会继续写入且当前资源安全；历史结果仍无法证明，保留未知，不伪造成功。';persist();render();openModal('opdetail',{id:o.id});}else{openModal('opdetail',{id:o.id});finishOperation(o,v);}break;}
 case'replica':{const target=pr(get('r-target')),primary=pr(get('r-primary'));if(!target||!primary||target.id===primary.id){modalError('主库和目标从库必须是两个不同的独立项目。');break;}if(get('r-ready')!=='ready'){rejectOperation(target,'replica','主库条件不满足：只提示缺少配置、复制账号或授权，不修改主库、不创建账号、不重启主库。');break;}if(target.hasBusinessData!==false||target.initResidue||target.replicaOf){rejectOperation(target,'replica','目标已有业务数据或初始化残留。拒绝本次初始化，不清空、覆盖或合并。');break;}if(!has('r-full')||!has('r-readonly')){modalError('请核对全库目标和日常只读要求。');break;}const cf=conflictFor(['mysql:'+primary.id+':*']);if(cf){rejectOperation(target,'replica','主库正被 '+cf.label+' 使用，请稍后重新提交。');break;}startOperation(target,'replica',{primary:primary.id,replicationUser:get('r-user'),extraResources:['mysql:'+primary.id+':*']},get('outcome'));break;}
 case'settings':S.settings={...S.settings,channels:all('channels'),http:get('setting-http'),telegram:get('setting-tg'),email:get('setting-email'),timezone:get('setting-zone')};persist();render();toast('仅保存演示通知设置，未发出网络请求。');break;
 case'cfaccount':S.settings.cfName=get('cf-name')||'Cloudflare · 演示账号';persist();closeModal();render();toast('演示账号名称已修改，没有连接真实账号。');break;
 default:modalError('暂未匹配到此表单的演示处理。');

function validIPv4(s){const a=s.split('.');return a.length===4&&a.every(v=>/^\d{1,3}$/.test(v)&&+v<=255)}
function validIPv6(s){try{return s.includes(':')&&new URL('http://['+s+']/').hostname.length>2}catch{return false}}
function validAddress(s){const [ip,bits,...rest]=s.split('/');if(rest.length)return false;const v4=validIPv4(ip),v6=validIPv6(ip);return (v4||v6)&&(bits===undefined||(/^\d+$/.test(bits)&&+bits<=(v4?32:128)));}
dialog.addEventListener('cancel',event=>{event.preventDefault();closeModal();});
